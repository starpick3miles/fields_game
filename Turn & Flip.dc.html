<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turn &amp; Flip</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/broadsheet-919da015-e8fa-4992-8e46-960ca11ecfe9/styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&amp;display=swap">
<script src="_ds/broadsheet-919da015-e8fa-4992-8e46-960ca11ecfe9/_ds_bundle.js"></script>
<style>
body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body),'Noto Serif KR',serif;word-break:keep-all;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
h1,h2{font-family:var(--font-heading),'Noto Serif KR',serif}
a{color:var(--color-accent-700)}a:hover{color:var(--color-accent-800)}
button{font-family:var(--font-body),'Noto Serif KR',serif}
@keyframes tfPulse{0%,100%{outline-color:transparent}50%{outline-color:var(--color-accent)}}
.tf-hole{outline:4px solid transparent}
.tf-ready{animation:tfPulse 1s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.tf-ready{animation:none;outline-color:var(--color-accent)}}
</style>
</helmet>
<div style="max-width:980px;padding:24px 28px 56px;display:flex;flex-direction:column;gap:28px;user-select:none;-webkit-user-select:none;touch-action:manipulation">
  <header style="display:flex;align-items:center;gap:20px;flex-wrap:wrap">
    <div style="font-family:var(--font-heading);font-weight:600;font-size:24px;letter-spacing:-0.015em;margin-right:auto">Turn &amp; Flip</div>
    <nav style="display:flex;gap:8px;flex-wrap:wrap">
      <sc-for list="{{ levelTabs }}" as="t" hint-placeholder-count="5">
        <button onClick="{{ t.go }}" title="{{ t.title }}" style="min-width:76px;min-height:60px;padding:6px 10px;border:1px solid {{ t.border }};background:{{ t.bg }};color:{{ t.fg }};border-radius:2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px">
          <span style="font-size:18px;font-weight:600;line-height:1">{{ t.n }}</span>
          <span style="font-size:12px;line-height:1">{{ t.title }}</span>
          <span style="font-size:11px;letter-spacing:1px;line-height:1">{{ t.stars }}</span>
        </button>
      </sc-for>
    </nav>
    <button onClick="{{ toggleScore }}" aria-pressed="{{ showScore }}" style="min-height:60px;min-width:76px;padding:6px 12px;border:1px solid var(--color-divider);background:transparent;border-radius:2px;cursor:pointer;font-size:14px;color:var(--color-text)" style-hover="background:var(--color-neutral-200)">{{ scoreLabel }}</button>
    <button onClick="{{ toggleSound }}" aria-pressed="{{ soundOn }}" style="min-height:60px;min-width:76px;padding:6px 12px;border:1px solid var(--color-divider);background:transparent;border-radius:2px;cursor:pointer;font-size:14px;color:var(--color-text)" style-hover="background:var(--color-neutral-200)">{{ soundLabel }}</button>
  </header>

  <div style="display:flex;gap:40px;align-items:flex-end;flex-wrap:wrap">
    <div style="display:flex;flex-direction:column;gap:6px;max-width:640px;flex:1 1 320px">
      <div style="font-size:13px;color:var(--color-accent-700)">{{ kicker }}</div>
      <h1 style="margin:0;font-size:46px;line-height:1.1">{{ title }}</h1>
      <p style="margin:0;font-size:21px;line-height:1.5;text-wrap:pretty">{{ say }}</p>
    </div>
    <sc-if value="{{ showScore }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;flex-direction:column;gap:4px;min-width:120px">
        <div style="font-size:13px;color:var(--color-accent-700)">이동 횟수</div>
        <div style="font-family:var(--font-heading);font-weight:600;font-size:88px;line-height:0.9;letter-spacing:-0.02em;font-variant-numeric:tabular-nums">{{ moves }}</div>
      </div>
    </sc-if>
  </div>

  <div ref="{{ wrapRef }}" style="width:100%;max-width:800px;height:{{ stageH }}px;position:relative;touch-action:none">
    <div style="position:absolute;left:0;top:0;width:660px;height:380px;transform-origin:0 0;transform:scale({{ scale }});perspective:1300px;perspective-origin:50% 10%">
      <div ref="{{ planeRef }}" style="position:absolute;left:10px;top:20px;width:640px;height:320px;transform:rotateX(50deg);transform-style:preserve-3d">
        <div class="tf-m" style="position:absolute;left:0;top:0;width:1px;height:1px;pointer-events:none"></div>
        <div class="tf-m" style="position:absolute;left:639px;top:0;width:1px;height:1px;pointer-events:none"></div>
        <div class="tf-m" style="position:absolute;left:639px;top:319px;width:1px;height:1px;pointer-events:none"></div>
        <div class="tf-m" style="position:absolute;left:0;top:319px;width:1px;height:1px;pointer-events:none"></div>
        <sc-if value="{{ showDisc }}" hint-placeholder-val="{{ false }}">
          <div style="position:absolute;left:{{ disc.left }}px;top:30px;width:260px;height:260px;border-radius:50%;background:var(--color-surface);box-shadow:0 0 0 1px var(--color-divider), 0 18px 30px rgba(32,30,29,.12)"></div>
        </sc-if>
        <sc-if value="{{ showPlate }}" hint-placeholder-val="{{ false }}">
          <div style="position:absolute;left:{{ plate.left }}px;top:{{ plate.top }}px;width:{{ plate.w }}px;height:{{ plate.h }}px;background:var(--color-neutral-300);border-radius:4px;box-shadow:0 18px 30px rgba(32,30,29,.16)"></div>
        </sc-if>
        <sc-for list="{{ cells }}" as="q">
          <div style="position:absolute;left:{{ q.left }}px;top:{{ q.top }}px;width:56px;height:56px;background:{{ q.bg }};box-shadow:inset 0 0 0 1px rgba(32,30,29,.13);cursor:{{ q.cursor }};transform:translateZ(1px)"></div>
        </sc-for>
        <sc-for list="{{ holes }}" as="hc">
          <div class="{{ hc.cls }}" style="position:absolute;left:{{ hc.left }}px;top:{{ hc.top }}px;width:52px;height:52px;background:var(--color-neutral-700);box-shadow:inset 0 8px 12px rgba(0,0,0,.45);transform:translateZ(1px)"></div>
        </sc-for>
        <sc-if value="{{ isMirror }}" hint-placeholder-val="{{ false }}">
          <div style="position:absolute;left:317px;top:14px;width:6px;height:292px;background:var(--color-accent-2);transform:translateZ(2px);pointer-events:none"></div>
          <div style="position:absolute;left:320px;top:14px;width:84px;height:292px;transform-origin:0 50%;transform:rotateY(-90deg);background:color-mix(in srgb, var(--color-accent-2-200) 45%, transparent);box-shadow:inset 0 0 0 2px color-mix(in srgb, var(--color-accent-2) 50%, transparent);pointer-events:none"></div>
        </sc-if>
        <sc-for list="{{ ghost }}" as="g">
          <div style="position:absolute;left:{{ g.left }}px;top:{{ g.top }}px;width:56px;height:56px;background:{{ g.bg }};transform:translateZ(2px);pointer-events:none"></div>
        </sc-for>
        <sc-if value="{{ showHintCell }}" hint-placeholder-val="{{ false }}">
          <div style="position:absolute;left:{{ hintCell.left }}px;top:{{ hintCell.top }}px;width:56px;height:56px;box-sizing:border-box;border:5px solid var(--color-accent-2);transform:translateZ(3px);pointer-events:none"></div>
        </sc-if>
        <sc-for list="{{ floorCubes }}" as="c">
          <div class="tf-cube" style="position:absolute;left:{{ c.x }}px;top:{{ c.y }}px;width:56px;height:56px;transform-style:preserve-3d;cursor:{{ c.cursor }}">
            <div style="position:absolute;inset:0;background:{{ c.bottom }};transform:rotateY(180deg)"></div>
            <div style="position:absolute;inset:0;background:{{ c.dark }};transform-origin:50% 0;transform:rotateX(90deg);box-shadow:inset 0 0 0 1px rgba(32,30,29,.15)"></div>
            <div style="position:absolute;inset:0;background:{{ c.dark }};transform-origin:0 50%;transform:rotateY(-90deg);box-shadow:inset 0 0 0 1px rgba(32,30,29,.15)"></div>
            <div style="position:absolute;inset:0;background:{{ c.dark }};transform-origin:100% 50%;transform:rotateY(90deg);box-shadow:inset 0 0 0 1px rgba(32,30,29,.15)"></div>
            <div style="position:absolute;inset:0;background:{{ c.side }};transform-origin:50% 100%;transform:rotateX(-90deg);box-shadow:inset 0 0 0 1px rgba(32,30,29,.15)"></div>
            <div style="position:absolute;inset:0;background:{{ c.top }};transform:translateZ(56px);box-shadow:inset 0 0 0 1px rgba(32,30,29,.18), inset 0 0 0 5px rgba(255,255,255,.2)"></div>
          </div>
        </sc-for>
        <sc-if value="{{ showBench }}" hint-placeholder-val="{{ false }}">
          <div ref="{{ pieceRef }}" style="position:absolute;left:{{ bench.left }}px;top:{{ bench.top }}px;width:{{ bench.w }}px;height:{{ bench.h }}px;transform-style:preserve-3d;transform-origin:50% 50% 28px;cursor:{{ pieceCursor }}">
            <sc-for list="{{ benchCubes }}" as="c">
              <div style="position:absolute;left:{{ c.x }}px;top:{{ c.y }}px;width:56px;height:56px;transform-style:preserve-3d">
                <div style="position:absolute;inset:0;background:{{ c.bottom }};transform:rotateY(180deg);box-shadow:inset 0 0 0 1px rgba(32,30,29,.18), inset 0 0 0 5px rgba(255,255,255,.2)"></div>
                <div style="position:absolute;inset:0;background:{{ c.dark }};transform-origin:50% 0;transform:rotateX(90deg);box-shadow:inset 0 0 0 1px rgba(32,30,29,.15)"></div>
                <div style="position:absolute;inset:0;background:{{ c.dark }};transform-origin:0 50%;transform:rotateY(-90deg);box-shadow:inset 0 0 0 1px rgba(32,30,29,.15)"></div>
                <div style="position:absolute;inset:0;background:{{ c.dark }};transform-origin:100% 50%;transform:rotateY(90deg);box-shadow:inset 0 0 0 1px rgba(32,30,29,.15)"></div>
                <div style="position:absolute;inset:0;background:{{ c.side }};transform-origin:50% 100%;transform:rotateX(-90deg);box-shadow:inset 0 0 0 1px rgba(32,30,29,.15)"></div>
                <div style="position:absolute;inset:0;background:{{ c.top }};transform:translateZ(56px);box-shadow:inset 0 0 0 1px rgba(32,30,29,.18), inset 0 0 0 5px rgba(255,255,255,.2)"></div>
              </div>
            </sc-for>
          </div>
        </sc-if>
      </div>
    </div>
  </div>

  <sc-if value="{{ isPredict }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;flex-wrap:wrap;gap:36px;align-items:flex-start">
      <div style="display:flex;flex-direction:column;gap:10px">
        <div style="font-size:13px;color:var(--color-accent-700)">{{ qLabel }}</div>
        <div style="display:flex;align-items:center;gap:14px;padding:16px 22px;background:var(--color-surface);border-radius:2px;min-height:100px;box-sizing:border-box">
          <span aria-hidden="true" style="font-size:44px;line-height:1;color:{{ qOp.color }}">{{ qOp.glyph }}</span>
          <span style="display:flex;flex-direction:column;gap:2px">
            <span style="font-size:24px;font-weight:600">{{ qOp.word }}</span>
            <span style="font-size:14px;color:var(--color-neutral-700)">{{ qOp.sub }}</span>
          </span>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <div style="font-size:13px;color:var(--color-accent-700)">하나를 고르세요</div>
        <div style="display:flex;gap:14px;flex-wrap:wrap">
          <sc-for list="{{ options }}" as="op" hint-placeholder-count="3">
            <button onClick="{{ op.onClick }}" aria-label="{{ op.label }}" style="width:136px;height:136px;display:grid;place-items:center;background:var(--color-surface);border:4px solid {{ op.ring }};opacity:{{ op.opacity }};cursor:pointer;border-radius:2px;padding:0" style-hover="background:var(--color-accent-100)" style-active="background:var(--color-accent-200)">
              <div style="position:relative;width:{{ op.w }}px;height:{{ op.h }}px">
                <sc-for list="{{ op.cells }}" as="m">
                  <div style="position:absolute;left:{{ m.left }}px;top:{{ m.top }}px;width:24px;height:24px;background:var(--color-neutral-800)"></div>
                </sc-for>
              </div>
            </button>
          </sc-for>
        </div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ showOps }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;gap:12px;flex-wrap:wrap">
      <sc-for list="{{ ops }}" as="o" hint-placeholder-count="5">
        <button onClick="{{ o.onClick }}" style="width:112px;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:{{ o.bg }};border:4px solid {{ o.ring }};border-radius:2px;cursor:pointer;color:var(--color-text);padding:8px 4px" style-hover="background:var(--color-accent-100)" style-active="background:var(--color-accent-200)">
          <span aria-hidden="true" style="font-size:38px;line-height:1;color:{{ o.color }}">{{ o.glyph }}</span>
          <span style="font-size:16px;font-weight:600">{{ o.word }}</span>
          <span style="font-size:12px;color:var(--color-neutral-700)">{{ o.sub }}</span>
        </button>
      </sc-for>
    </div>
  </sc-if>

  <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
    <sc-if value="{{ showUndo }}" hint-placeholder-val="{{ true }}">
      <button onClick="{{ undo }}" style="min-height:56px;min-width:96px;padding:8px 16px;border:3px solid {{ undoRing }};background:transparent;border-radius:2px;cursor:pointer;font-size:17px;color:var(--color-text);display:flex;align-items:center;gap:8px" style-hover="background:var(--color-neutral-200)"><span aria-hidden="true" style="font-size:22px">↶</span> 되돌리기</button>
    </sc-if>
    <button onClick="{{ hint }}" style="min-height:56px;min-width:96px;padding:8px 16px;border:3px solid transparent;background:transparent;border-radius:2px;cursor:pointer;font-size:17px;color:var(--color-accent-700);display:flex;align-items:center;gap:8px" style-hover="background:var(--color-accent-100)"><span aria-hidden="true" style="font-size:20px">?</span> 힌트</button>
    <div style="display:flex;gap:24px;margin-left:12px;font-size:18px;flex-wrap:wrap">
      <span>{{ extraInfo }}</span>
    </div>
  </div>

  <sc-if value="{{ won }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:color-mix(in srgb, var(--color-neutral-900) 45%, transparent);z-index:10">
      <div style="width:min(540px,100%);max-height:calc(100vh - 40px);overflow:auto;box-sizing:border-box;display:flex;flex-direction:column;gap:18px;padding:36px;background:var(--color-bg);border-radius:4px;box-shadow:var(--shadow-lg)">
        <div style="font-size:13px;color:var(--color-accent-700)">{{ doneKicker }}</div>
        <sc-if value="{{ showScore }}" hint-placeholder-val="{{ true }}">
          <div style="display:flex;gap:8px;font-size:60px;line-height:1">
            <sc-for list="{{ starList }}" as="st"><span style="color:{{ st.color }}">★</span></sc-for>
          </div>
          <div style="font-size:18px">{{ doneMoves }}</div>
        </sc-if>
        <sc-if value="{{ hasLog }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            <sc-for list="{{ logChips }}" as="lc">
              <span style="min-width:40px;height:40px;display:grid;place-items:center;background:var(--color-surface);border-radius:2px;font-size:22px;color:{{ lc.color }}">{{ lc.glyph }}</span>
            </sc-for>
          </div>
        </sc-if>
        <h2 style="margin:6px 0 0;font-size:24px">이동 정리</h2>
        <sc-for list="{{ explain }}" as="p">
          <p style="margin:0;font-size:19px;line-height:1.55;text-wrap:pretty">{{ p }}</p>
        </sc-for>
        <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:8px">
          <button onClick="{{ next }}" style="min-height:56px;padding:10px 22px;border:0;background:var(--color-accent-700);color:var(--color-bg);border-radius:2px;cursor:pointer;font-size:18px;font-weight:600" style-hover="background:var(--color-accent-800)" style-active="background:var(--color-accent-900)">{{ nextLabel }}</button>
          <button onClick="{{ replay }}" style="min-height:56px;padding:10px 22px;border:1px solid var(--color-divider);background:transparent;color:var(--color-text);border-radius:2px;cursor:pointer;font-size:18px" style-hover="background:var(--color-neutral-200)">다시 하기</button>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;twoTone&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Teaching&quot;},&quot;scoring&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Teaching&quot;},&quot;sound&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Feedback&quot;}}">
const S = 56, STORE = 'turnflip.v1';
const BCX = 160, BCY = 160;            // bench centre on the table plane (levels 1, 2, 5)
const HOLE_DX = 320;                   // bench centre to hole centre
const ZERO = 'translate3d(0px,0px,0px)';
const OPS = {
  cw:   { m:[0,-1,1,0],  glyph:'↻', word:'회전', sub:'시계 방향 90°',   f:a=>`rotateZ(${a}deg)`,  deg:90,  flip:false },
  ccw:  { m:[0,1,-1,0],  glyph:'↺', word:'회전', sub:'반시계 방향 90°', f:a=>`rotateZ(${-a}deg)`, deg:90,  flip:false },
  half: { m:[-1,0,0,-1], glyph:'↻', word:'회전', sub:'180°',            f:a=>`rotateZ(${a}deg)`,  deg:180, flip:false },
  lr:   { m:[-1,0,0,1],  glyph:'↔', word:'대칭', sub:'세로 대칭축',     f:a=>`rotateY(${a}deg)`,  deg:180, flip:true },
  ud:   { m:[1,0,0,-1],  glyph:'↕', word:'대칭', sub:'가로 대칭축',     f:a=>`rotateX(${a}deg)`,  deg:180, flip:true },
  diag: { m:[0,1,1,0],   glyph:'⤡', word:'대칭', sub:'대각선 대칭축',   f:a=>`rotate3d(1,1,0,${a}deg)`, deg:180, flip:true },
};
const NET = {
  '1,0,0,1':'지금까지의 이동을 합치면 처음 모양 그대로입니다.',
  '0,-1,1,0':'지금까지의 이동을 합치면 시계 방향 90° 회전과 같습니다.',
  '-1,0,0,-1':'지금까지의 이동을 합치면 180° 회전과 같습니다.',
  '0,1,-1,0':'지금까지의 이동을 합치면 반시계 방향 90° 회전과 같습니다. 시계 방향 270° 회전과도 같습니다.',
  '-1,0,0,1':'지금까지의 이동을 합치면 세로 대칭축에 대한 대칭과 같습니다.',
  '1,0,0,-1':'지금까지의 이동을 합치면 가로 대칭축에 대한 대칭과 같습니다.',
  '0,1,1,0':'지금까지의 이동을 합치면 대각선 대칭축에 대한 대칭과 같습니다.',
  '0,-1,-1,0':'지금까지의 이동을 합치면 대각선 대칭축에 대한 대칭과 같습니다.',
};
const norm = cells => { const mx=Math.min(...cells.map(c=>c[0])), my=Math.min(...cells.map(c=>c[1])); return cells.map(([x,y])=>[x-mx,y-my]).sort((a,b)=>a[1]-b[1]||a[0]-b[0]); };
const key = cells => norm(cells).map(c=>c.join(',')).join(';');
const apply = (m, cells) => norm(cells.map(([x,y])=>[m[0]*x+m[1]*y, m[2]*x+m[3]*y]));
const mul = (a,b) => [a[0]*b[0]+a[1]*b[2], a[0]*b[1]+a[1]*b[3], a[2]*b[0]+a[3]*b[2], a[2]*b[1]+a[3]*b[3]];
const bfs = (start, target, ops) => {
  const q=[{c:norm(start),p:[]}], seen=new Set([key(start)]);
  while(q.length){ const {c,p}=q.shift(); if(key(c)===target) return p;
    for(const id of ops){ const n=apply(OPS[id].m,c), k=key(n); if(!seen.has(k)){seen.add(k); q.push({c:n,p:[...p,id]});} } }
  return null;
};
// every orientation a piece can reach with the level's moves
const orients = (piece, ops) => {
  const seen=new Map([[key(piece), norm(piece)]]), q=[norm(piece)];
  while(q.length){ const c=q.shift(); for(const id of ops){ const n=apply(OPS[id].m,c), k=key(n); if(!seen.has(k)){ seen.set(k,n); q.push(n); } } }
  return [...seen.values()];
};
const firstEmpty = occ => { for(let y=0;y<4;y++) for(let x=0;x<4;x++) if(!occ.has(x+','+y)) return [x,y]; return null; };
const fitAt = (sh, e, occ) => { const ox=e[0]-sh[0][0], oy=e[1]-sh[0][1], abs=sh.map(([x,y])=>[x+ox,y+oy]);
  return abs.every(([x,y])=>x>=0&&y>=0&&x<4&&y<4&&!occ.has(x+','+y)) ? abs : null; };
// can the rest of the 4×4 board still be tiled?
const canTile = (occ, shapes) => {
  const e = firstEmpty(occ); if(!e) return true;
  for(const sh of shapes){ const abs = fitAt(sh, e, occ); if(!abs) continue;
    const o2 = new Set(occ); abs.forEach(c=>o2.add(c.join(',')));
    if(canTile(o2, shapes)) return true; }
  return false;
};
const kf = op => { const lift=op.flip?110:16; return [
  {transform:`translateZ(0px) ${op.f(0)}`},
  {transform:`translateZ(${lift}px) ${op.f(op.deg/2)}`},
  {transform:`translateZ(0px) ${op.f(op.deg)}`}]; };

const solveH = (src, dst) => {

class Component extends DCLogic {

  /* ---------- animation helpers ---------- */

  /* ---------- moves ---------- */

  /* ---------- touch: where is the finger on the table? ---------- */
  measure(){

    const hit = document.elementFromPoint(cx, cy), cube = hit && hit.closest ? hit.closest('.tf-cube') : null;
    if(cube) return [Math.round((parseFloat(cube.style.left)-B.x)/S), Math.round((parseFloat(cube.style.top)-B.y)/S)];

  pCancel(e){
    const g = this.g; if(!g) return;
    this.g = null; clearTimeout(g.timer); this.setT('');
    if(this.state.ghost && !this.state.ghost.tap) this.setState({ghost:null});
    this.resumeReady();
  }
  flick(dx, dy){
    const a = ((Math.atan2(dy, dx)*180/Math.PI) % 180 + 180) % 180;
    const id = (a<22.5 || a>=157.5) ? 'lr' : (a>=67.5 && a<112.5) ? 'ud' : 'diag';
    if((LEVELS[this.state.lv].ops||[]).includes(id)) this.doOp(id, true); else this.resumeReady();
  }
  endTurn(acc){
    const steps = Math.round(acc/90), from = `rotateZ(${acc}deg)`;
    if(!steps){
      if(Math.abs(acc) < 1){ this.setT(''); this.resumeReady(); return; }
      this.setState({busy:true});
      this.tween(from, 'rotateZ(0deg)', 150, a => { a && a.cancel(); this.idle(); }); return;
    }
    const id = steps>0 ? 'cw' : 'ccw', ids = Array(Math.abs(steps)).fill(id);
    this.beep('turn'); this.flash(id);
    this.setState({busy:true, ready:false, hint:null});
    this.tween(from, `rotateZ(${steps*90}deg)`, 150, a => this.commitOps(ids, () => { a && a.cancel(); this.afterOp(); }));
  }
  startDrag(){
    const g = this.g, s = this.state, t = LEVELS[s.lv].type;
    if(!g || g.mode!=='pending' || s.busy || s.won || (t!=='fill' && t!=='match')) return;
    g.mode = 'drag'; this.beep('tick');
    if(s.hint || s.ghost) this.setState({hint:null, ghost:null});
    this.dragTo(g.last[0], g.last[1]);
  }
  dragTo(x, y){
    const g = this.g, s = this.state, P = this.toPlane(x, y);
    const pw = Math.max(...s.piece.map(c=>c[0]))+1, ph = Math.max(...s.piece.map(c=>c[1]))+1;
    const cx = P[0], cy = P[1] - ph*S/2 - 20;          // the piece rides above the finger
    g.d = [cx-BCX, cy-BCY];
    this.setT(`translate3d(${g.d[0]}px,${g.d[1]}px,40px)`);
    if(LEVELS[s.lv].type!=='fill') return;
    const ox = Math.round((cx-pw*S/2-368)/S), oy = Math.round((cy-ph*S/2-48)/S);
    const over = ox>-pw && ox<4 && oy>-ph && oy<4, k = over ? ox+','+oy : '';
    if(k===g.gk) return;
    g.gk = k; g.o = [ox, oy];
    this.setState({ ghost: over ? this.placementAt(ox, oy) : null });
  }
  endDrag(g){
    const s = this.state, L = LEVELS[s.lv], d = g.d || [0,0];
    const from = `translate3d(${d[0]}px,${d[1]}px,40px)`;
    const back = loud => { if(loud) this.beep('bad'); this.setState({busy:true});
      this.tween(from, ZERO, 250, a => { a && a.cancel(); this.idle(); }); };
    if(L.type==='fill'){
      const gh = s.ghost;
      if(gh && gh.ok && !gh.tap){
        const pw = Math.max(...s.piece.map(c=>c[0]))+1, ph = Math.max(...s.piece.map(c=>c[1]))+1;
        const tx = 368 + g.o[0]*S + pw*S/2 - BCX, ty = 48 + g.o[1]*S + ph*S/2 - BCY;
        this.setState({busy:true});
        this.tween(from, `translate3d(${tx}px,${ty}px,0px)`, 120, a => this.place(gh.abs, () => { a && a.cancel(); }));
      } else back(Math.hypot(d[0], d[1]) > 80);
      return;
    }
    const overHole = Math.hypot(d[0]-HOLE_DX, d[1]) < 100;
    if(!overHole){ back(false); return; }
    if(key(s.piece)===key(L.target)){
      this.setState({busy:true, ready:false});
      this.tween(from, `translate3d(${HOLE_DX}px,0px,0px)`, 200, a => { this.winAnim = a; this.beep('place'); this.tm = setTimeout(()=>this.finish(), 400); });
    } else {
      const rest = `translate3d(${HOLE_DX}px,0px,6px)`;
      this.setState({busy:true});
      this.tween(from, rest, 150, a => { this.tm = setTimeout(() => { this.beep('bad');
        this.tween(rest, ZERO, 250, b => { a && a.cancel(); b && b.cancel(); this.idle(); }); }, 400); });
    }
  }

  renderVals(){
    const s = this.state, L = LEVELS[s.lv], t = L.type;
    const two = this.props.twoTone ?? true;
    const col = (flipped, alt) => { const c = two&&flipped?'accent-2':'accent', o = two?(flipped?'accent':'accent-2'):'accent';
      return { top:`var(--color-${c}-${alt?300:400})`, side:`var(--color-${c}-500)`, dark:`var(--color-${c}-600)`, bottom:`var(--color-${o}-400)` }; };
    const opColor = id => OPS[id].flip && two ? 'var(--color-accent-2-700)' : 'var(--color-accent-700)';
    const benchCx = t==='predict' ? 320 : BCX;
    const pw = s.piece.length ? Math.max(...s.piece.map(c=>c[0]))+1 : 0, ph = s.piece.length ? Math.max(...s.piece.map(c=>c[1]))+1 : 0;
    const bench = { left:benchCx-pw*S/2, top:BCY-ph*S/2, w:pw*S, h:ph*S };
    const benchCubes = s.piece.map(([x,y])=>({ x:x*S, y:y*S, ...col(s.flipped) }));
    const B = t==='mirror' ? {x:96,y:20} : {x:368,y:48};

    let cells = [], floorCubes = [], holes = [], plate = null;
    if(t==='match'){
      plate = {left:356, top:36, w:248, h:248};
      const tg = norm(L.target), tw = Math.max(...tg.map(c=>c[0]))+1, th = Math.max(...tg.map(c=>c[1]))+1;
      holes = tg.map(([x,y])=>({ left:480-tw*S/2+x*S+2, top:160-th*S/2+y*S+2, cls: s.ready ? 'tf-hole tf-ready' : 'tf-hole' }));
    }
    if(t==='fill'){
      plate = {left:356, top:36, w:248, h:248};
      for(let y=0;y<4;y++) for(let x=0;x<4;x++) cells.push({ left:B.x+x*S, top:B.y+y*S, bg:'var(--color-neutral-100)', cursor:'pointer' });
      floorCubes = s.placed.flatMap((p,i)=>p.cells.map(([x,y])=>({ x:B.x+x*S, y:B.y+y*S, cursor:'default', ...col(p.flipped, i%2) })));
    }
    if(t==='mirror'){
      plate = {left:84, top:8, w:472, h:304};
      for(let y=0;y<L.rows;y++) for(let x=0;x<L.cols;x++){ const r = x>=L.cols/2;
        cells.push({ left:B.x+x*S, top:B.y+y*S, bg:r?'var(--color-neutral-100)':'var(--color-neutral-200)', cursor:r?'pointer':'default' }); }
      floorCubes = [
        ...L.left.map(([x,y])=>({ x:B.x+x*S, y:B.y+y*S, cursor:'default', ...col(false) })),
        ...s.right.map(k=>{ const [x,y]=k.split(',').map(Number); return { x:B.x+x*S, y:B.y+y*S, cursor:'pointer', ...col(true) }; })
      ];
    }
    const ghost = s.ghost ? s.ghost.abs.filter(([x,y])=>x>=0&&y>=0&&x<4&&y<4).map(([x,y])=>({ left:B.x+x*S, top:B.y+y*S,
      bg: s.ghost.ok ? 'color-mix(in srgb, var(--color-accent) 45%, transparent)' : 'color-mix(in srgb, var(--color-accent-2) 45%, transparent)' })) : [];
    const hc = s.hint && s.hint.cell;

    const ops = (L.ops||[]).map(id=>({ glyph:OPS[id].glyph, word:OPS[id].word, sub:OPS[id].sub, color:opColor(id),
      bg: s.flash===id ? 'var(--color-accent-200)' : 'var(--color-surface)',
      ring: s.hint && s.hint.op===id ? 'var(--color-accent-2)' : 'transparent', onClick:()=>this.doOp(id) }));

    let qOp = {}, options = [], qLabel = '';
    if(t==='predict'){
      const Q = L.qs[s.q], r = s.q % 3, order = Q.opts.slice(r).concat(Q.opts.slice(0,r));
      qOp = { glyph:OPS[Q.op].glyph, word:OPS[Q.op].word, sub:OPS[Q.op].sub, color:opColor(Q.op) };
      qLabel = `문제 ${s.q+1} / ${L.qs.length} · 이 이동을 하면`;
      options = order.map((id,i)=>{ const sh = apply(OPS[id].m, Q.piece);
        return { label:`보기 ${i+1}`, w:(Math.max(...sh.map(c=>c[0]))+1)*26-2, h:(Math.max(...sh.map(c=>c[1]))+1)*26-2,
          cells: sh.map(([x,y])=>({left:x*26, top:y*26})),
          ring: s.picked===id ? 'var(--color-accent)' : 'transparent', opacity: s.wrong.includes(id) ? 0.25 : 1,
          onClick:()=>this.pick(id) }; });
    }

    const nTurns = s.log.filter(id=>!OPS[id].flip).length, nFlips = s.log.length - nTurns;
    const netKey = s.net.join(','), netFlip = s.net[0]*s.net[3]-s.net[1]*s.net[2] < 0;
    let explain = [];
    if(t==='match'){
      explain.push(NET[netKey]);
      if(netFlip) explain.push('대칭은 대칭축을 기준으로 도형을 뒤집는 이동입니다. 모양과 크기는 그대로이고 좌우 또는 위아래가 바뀝니다.' + (two ? ' 도형의 반대쪽 면이 위로 올라와서 색이 바뀌었습니다.' : ''));
      else explain.push('회전은 도형을 한 점을 중심으로 돌리는 이동입니다. 모양과 크기는 그대로이고 방향만 바뀝니다.' + (netKey==='-1,0,0,-1' ? ' 90° 회전을 두 번 하면 180° 회전이 됩니다.' : ''));
    }
    if(t==='predict') explain = ['회전은 도형을 한 점을 중심으로 돌리는 이동입니다. 90° 회전을 두 번 하면 180° 회전이 됩니다.', '대칭은 대칭축을 기준으로 도형을 뒤집는 이동입니다. 거울에 비친 모양과 같습니다.'];
    if(t==='mirror') explain = ['선대칭에서는 서로 짝이 되는 두 칸이 대칭축에서 같은 거리에 있습니다.', '대칭축을 따라 판을 접으면 두 쪽이 완전히 겹칩니다.'];
    if(t==='fill') explain = [`회전 ${nTurns}번, 대칭 ${nFlips}번을 사용했습니다.`,
      two ? '파란색 도형은 회전만 한 도형입니다. 분홍색 도형은 대칭시킨 도형이어서 파란색 도형과 좌우가 반대입니다.' : '대칭시킨 도형은 회전만 한 도형과 좌우가 반대입니다.'];

    const best = s.best;
    return {
      pieceRef:this.pieceRef, wrapRef:this.wrapRef, planeRef:this.planeRef,
      levelTabs: LEVELS.map((lv,i)=>({ n:i+1, title:lv.title, stars: s.score ? '★'.repeat(best[i]||0)+'☆'.repeat(3-(best[i]||0)) : '',
        bg:i===s.lv?'var(--color-accent-700)':'transparent', fg:i===s.lv?'var(--color-bg)':'var(--color-text)',
        border:i===s.lv?'var(--color-accent-700)':'var(--color-divider)', go:()=>this.load(i) })),
      showScore: s.score, soundOn: s.sound,
      scoreLabel: s.score ? '★ 점수 켬' : '★ 점수 끔',
      toggleScore: () => this.setState({score:!s.score}, () => this.persist()),
      soundLabel: s.sound ? '♪ 소리 켬' : '♪ 소리 끔',
      toggleSound: () => this.setState({sound:!s.sound}, () => this.persist()),
      kicker:`${s.lv+1}단계 / ${LEVELS.length}단계`, title:L.title, say:L.say,
      scale:s.scale, stageH:Math.round(380*s.scale),
      showDisc: t!=='mirror', disc:{left:benchCx-130},
      showPlate: !!plate, plate: plate||{},
      cells, holes, floorCubes, ghost, isMirror: t==='mirror',
      showHintCell: !!hc, hintCell: hc ? {left:B.x+hc[0]*S, top:B.y+hc[1]*S} : {},
      showBench: t!=='mirror', bench, benchCubes, pieceCursor: t==='predict' ? 'default' : 'grab',
      isPredict: t==='predict', qOp, options, qLabel,
      showOps: t==='match' || t==='fill', ops,
      showUndo: t!=='predict', undoRing: s.hint && s.hint.undo ? 'var(--color-accent-2)' : 'transparent',
      undo: () => this.undo(), hint: () => this.hint(), moves: s.moves,
      extraInfo: t==='fill' ? `놓은 도형 ${s.placed.length} / 4` : '',
      won: s.won, doneKicker:`${s.lv+1}단계 완료`,
      starList: [0,1,2].map(i=>({ color: i<s.stars ? 'var(--color-accent-2)' : 'var(--color-neutral-300)' })),
      doneMoves: t==='predict' ? `${L.qs.length}문제 중 ${s.firstTry}문제를 한 번에 맞혔습니다` : `이동 ${s.moves}번`,
      hasLog: (t==='match' || t==='fill') && s.log.length>0,
      logChips: s.log.map(id=>({ glyph:OPS[id].glyph, color:opColor(id) })),
      explain,
      nextLabel: s.lv < LEVELS.length-1 ? '다음 단계' : '1단계로',
      next: () => this.load((s.lv+1) % LEVELS.length),
      replay: () => this.load(s.lv),
    };
  }
}
</script>
